# Next.js em web/ — Netlify corre build e publica com o runtime Next
# https://docs.netlify.com/frameworks/next-js/overview/

[build]
  base = "web"
  command = "npm run build"
  # Relativo ao base. Não pode ser igual ao base (erro do plugin). Sobrepõe "Publish directory" = web na UI.
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"

[[plugins]]
  package = "@netlify/plugin-nextjs"
